name: CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.0.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install SeqEFT
        run: python -m pip install -e ".[test,data]"
      - name: Test
        run: python -m pytest -q
