[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqeft"
version = "0.1.0"
description = "Latent Sequence Alignment for EEG-to-fMRI Translation"
readme = "README.en.md"
requires-python = ">=3.9,<3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "SeqEFT contributors"}]
dependencies = [
    "torch==2.0.0",
    "numpy==1.24.3",
    "PyYAML==6.0.3",
    "einops==0.8.2",
    "linear-attention-transformer==0.19.1",
    "axial-positional-embedding==0.2.1",
    "linformer==0.2.3",
    "local-attention==1.8.6",
    "product-key-memory==0.1.11",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
data = ["mne==1.4.2", "pandas==2.3.3", "scipy==1.10.1"]

[project.urls]
Homepage = "https://xingong6880.github.io/projects/seqeft/"
Repository = "https://github.com/xingong6880/SeqEFT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
